name: Workshop Preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  participant-setup:
    name: participant setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tutorial_materials/idetc2026/requirements.txt

      - name: Verify published setup files
        run: python scripts/build_idetc2026_bundle.py --check --kind setup

      - name: Run clean participant install and preflight
        run: python scripts/run_idetc2026_preflight_install.py
