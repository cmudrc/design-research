name: Examples

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            "design-research-analysis==0.2.0" \
            "design-research-agents==0.4.0" \
            "design-research-problems==0.3.0" \
            "design-research-experiments==0.2.0"
          pip install -e ".[dev]"

      - name: Run deterministic examples
        run: make examples-test

      - name: Check public API example coverage
        run: make examples-coverage
