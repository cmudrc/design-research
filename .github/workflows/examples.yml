name: Examples

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reviewed release candidates
        if: github.ref != 'refs/heads/main'
        run: make dev-release-candidates

      - name: Install published dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run deterministic examples
        run: make examples-test

      - name: Check public API example coverage
        run: make examples-coverage
